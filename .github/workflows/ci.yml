name: App checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile Python source
        run: python -m py_compile app.py
      - name: Check required project files
        run: |
          python - <<'PY'
          from pathlib import Path
          required = [
              Path('app.py'), Path('requirements.txt'),
              Path('data/limma_tumor_vs_normal_all_genes.csv'),
              Path('data/sample_metadata.csv'), Path('scripts/run_gse42568.R'),
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit(f'Missing required files: {missing}')
          print('Required app and cohort files are present.')
          PY
